name: Upstream compatibility report
description: Report a gotd/cli command or pinned release compatibility problem.
title: "[Upstream]: "
labels:
  - upstream-compatibility
body:
  - type: input
    id: plugin-version
    attributes:
      label: TG Agent Plugin version
    validations:
      required: true
  - type: input
    id: tg-version
    attributes:
      label: Pinned gotd/cli version
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command name
      description: Name the command without any private argument value.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Redacted behavior
      description: Do not include Telegram messages, peers, phone numbers, credentials, or session data.
    validations:
      required: true

name: Bug report
description: Report a non-sensitive TG Agent Plugin behavior problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, session files, phone numbers, QR images, or private Telegram content. Report security issues through SECURITY.md.
  - type: input
    id: host
    attributes:
      label: Host and version
      description: Claude Code or Codex, including the version.
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the problem using redacted, non-sensitive data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, session data, phone numbers, and private Telegram content.
          required: true

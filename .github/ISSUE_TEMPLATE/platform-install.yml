name: Platform installation failure
description: Report a non-sensitive install, repair, archive, or launcher problem.
title: "[Platform]: "
labels:
  - platform
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - arm64
    validations:
      required: true
  - type: input
    id: result
    attributes:
      label: Lifecycle status or error class
      description: For example, checksum mismatch or stale backup. Do not paste secrets or session paths.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Redacted details
      description: Include host and plugin versions, but no Telegram content, credentials, or session data.
    validations:
      required: true
